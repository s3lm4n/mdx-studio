name: foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject machine-specific absolute paths in implementation files
        shell: bash
        run: |
          set -euo pipefail
          roots=(apps services packages scripts tests)
          if grep -RInE --exclude='*.md' --exclude-dir=node_modules --exclude-dir=target --exclude-dir=dist --exclude=foundation.yml 'C:\\Users\\|/home/[A-Za-z0-9._-]+/' "${roots[@]}"; then
            echo 'Machine-specific absolute path detected in implementation files.' >&2
            exit 1
          fi

  # Git attribution policy (CLAUDE.md): rejects Claude/Anthropic author/committer identities,
  # Co-Authored-By and Claude-Session trailers in the commits this push or pull request introduces.
  # Commits already reachable from the base are never inspected.
  commit-attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: range arithmetic needs the base and must not stop at a shallow boundary.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reject Claude/Anthropic attribution in introduced commits
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          is_zero() { [[ "$1" =~ ^0+$ ]]; }
          has_commit() { git cat-file -e "$1^{commit}" 2>/dev/null; }
          case "$EVENT_NAME" in
            pull_request)
              # The PR's own head, not the synthetic merge commit actions/checkout leaves at HEAD.
              revs=("$PR_HEAD_SHA" "^$PR_BASE_SHA")
              # Also exclude the base branch's current tip, in case base.sha predates base commits
              # that were merged into the PR branch.
              if has_commit "refs/remotes/origin/$PR_BASE_REF"; then
                revs+=("^refs/remotes/origin/$PR_BASE_REF")
              fi
              ;;
            push)
              if is_zero "$PUSH_AFTER"; then
                echo "Ref deleted: no commits introduced."
                exit 0
              fi
              if ! is_zero "$PUSH_BEFORE" &&
                { has_commit "$PUSH_BEFORE" || git fetch --no-tags --quiet origin "$PUSH_BEFORE"; } &&
                has_commit "$PUSH_BEFORE"; then
                revs=("$PUSH_AFTER" "^$PUSH_BEFORE")
              else
                # New branch/tag (all-zero before), or a force-push whose old tip is gone: inspect
                # everything not already on the default branch.
                echo "No usable 'before' commit; comparing against origin/$DEFAULT_BRANCH."
                revs=("$PUSH_AFTER" "^refs/remotes/origin/$DEFAULT_BRANCH")
              fi
              ;;
            *)
              echo "Unsupported event '$EVENT_NAME' for the attribution check." >&2
              exit 1
              ;;
          esac
          node scripts/check-commit-attribution.mjs "${revs[@]}"

  # Linux validation of the TypeScript workspace. Not evidence of Windows compatibility.
  node-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Protocol JSON Schema is up to date
        run: pnpm --filter @mdx-studio/protocol exec tsx scripts/emit-schema.ts --check

  # Linux validation of the Tauri crate. Not evidence of Windows compatibility.
  rust-checks-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  # Windows is the authoritative desktop target. This job is DEFINED but had not been run when it
  # was added; the first green run is the first Windows evidence (see docs/VALIDATION_STATUS.md).
  windows-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Build the desktop binary (no installer bundle)
        run: pnpm --filter @mdx-studio/desktop tauri build --no-bundle
