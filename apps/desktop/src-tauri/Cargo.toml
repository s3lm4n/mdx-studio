[package]
name = "mdx-studio-desktop"
version = "0.0.0"
description = "MDX Studio desktop shell (Tauri 2)"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "mdx_studio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
